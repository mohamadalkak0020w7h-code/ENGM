name: Build Al-Rafiq APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Organize Android Project
        run: |
          mkdir -p app/src/main/assets app/src/main/java/com/mohamadalqaaq/alrafiq app/src/main/res/mipmap-xxxhdpi
          mv MainActivity.java app/src/main/java/com/mohamadalqaaq/alrafiq/
          mv AndroidManifest.xml app/src/main/
          mv index.html app/src/main/assets/
          mv ic_launcher.png app/src/main/res/mipmap-xxxhdpi/
          printf "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }\ndependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }\nrootProject.name = 'AlRafiqChat'\ninclude ':app'\n" > settings.gradle
          printf "plugins { id 'com.android.application' version '8.2.2' apply false }\n" > build.gradle
          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.mohamadalqaaq.alrafiq'
              compileSdk 34
              defaultConfig { applicationId 'com.mohamadalqaaq.alrafiq'; minSdk 24; targetSdk 34; versionCode 1; versionName '1.0' }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
          EOF
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AlRafiq-Chat-APK
          path: app/build/outputs/apk/debug/app-debug.apk
